<!DOCTYPE html>

<title>STC World Cup 2026 — Face-Off Tracker</title>
<!--
  SINGLE-FILE face-off tracker for the STC World Cup 2026 betting pool.
  Everything (data + styles + logic) lives in this one file. No build, no server.
  - Open it by double-clicking, or host it anywhere static.
  - It shows every group match as a manager-vs-manager face-off, with a filter
    to see when a chosen manager plays each rival.
  - Live dates/scores are pulled in-browser from TheSportsDB (free, no key needed).
    If offline / unavailable, it falls back to the matchups from the official draw.
-->
<style>
  :root{
    --bg:#0b1020;--card:#161e3d;--card2:#1b2547;--line:#25305a;
    --text:#eef2ff;--muted:#93a0c4;--accent:#38bdf8;--live:#ef4444;--win:#22c55e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#1a2350 0%,var(--bg) 60%);
    color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh}
  header{position:sticky;top:0;z-index:10;background:rgba(11,16,32,.85);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line)}
  .inner{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;
    justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:11px}
  .ball{font-size:28px}
  h1{font-size:16px;margin:0}
  .tag{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);
    background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:999px;white-space:nowrap}
  .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .pill.live .dot{background:var(--live);animation:pulse 1.4s infinite}
  .pill.ok .dot{background:var(--win)}
  .pill.offline .dot{background:#f59e0b}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}70%{box-shadow:0 0 0 7px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
  main{max-width:720px;margin:0 auto;padding:14px 16px 60px}
  .row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:999px;
    padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .chip.active{color:#061018;background:var(--accent);border-color:var(--accent)}
  .chip .sw{width:9px;height:9px;border-radius:50%;display:inline-block}
  .chip.mgr.active{color:var(--text);background:var(--card2);border-color:currentColor}
  .summary{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 13px;
    margin:6px 0 14px;font-size:12.5px;color:var(--muted);line-height:1.7}
  .summary b{color:var(--text)}
  .summary .h2h{display:inline-flex;gap:5px;align-items:center;margin:2px 8px 2px 0}
  .datehead{position:sticky;top:57px;background:var(--bg);padding:5px 0;margin:16px 0 8px;
    font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .match{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 14px;
    display:grid;gap:9px;margin-bottom:10px}
  .match.live{border-color:rgba(239,68,68,.6);box-shadow:0 0 0 1px rgba(239,68,68,.25)}
  .mtop{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--muted)}
  .gtag{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-weight:700;letter-spacing:.4px}
  .badge{font-weight:700}
  .badge.LIVE{color:var(--live)} .badge.FINISHED{color:var(--muted)} .badge.SCHEDULED{color:var(--accent)}
  .ldot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:5px;animation:pulse 1.4s infinite}
  .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
  .team{display:grid;gap:4px}
  .team.away{text-align:right;justify-items:end}
  .tline{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
  .team.away .tline{flex-direction:row-reverse}
  .flag{font-size:20px}
  .owners{display:flex;flex-wrap:wrap;gap:4px}
  .team.away .owners{justify-content:flex-end}
  .own{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;color:#06101c;white-space:nowrap}
  .own.dim{opacity:.4}
  .score{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;text-align:center;min-width:54px}
  .score .kick{font-size:12px;font-weight:700;color:var(--muted)}
  .score .cd{font-size:11px;font-weight:700;color:var(--accent)}
  .vs{border-top:1px dashed var(--line);padding-top:9px;font-size:12.5px;display:flex;
    align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
  .vs .side{display:inline-flex;gap:4px;flex-wrap:wrap}
  .vs .x{color:var(--muted);font-weight:800}
  .vs .both{color:var(--win);font-weight:700;font-size:11px;width:100%;text-align:center}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 0}
  footer{max-width:720px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:11px;text-align:center}
  @media(max-width:460px){.tline{font-size:13.5px}.score{font-size:18px;min-width:46px}.flag{font-size:17px}}
</style>

const pairKey=(a,b)=>[a,b].sort().join("|");
const num=v=>(v!=null&&v!=="")?+v:null;

/* ---------------- Indices -------------------------------------------------- */

const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
TEAMS.forEach(t=>{byId[t.id]=t;byNorm[norm(t.name)]=t;t.aliases.forEach(a=>byNorm[norm(a)]=t);ownersByTeam[t.id]=[];});
MANAGERS.forEach(m=>SQUADS[m].forEach(id=>ownersByTeam[id]&&ownersByTeam[id].push(m)));
const resolve=name=>byNorm[norm(name)]||null;

let state={fixtures:[],source:"loading",statusFilter:"all",mgrFilter:"all"};

/* ---------------- Fixtures ------------------------------------------------- */
// Build the 72 fixtures from the baked schedule; matchday is derived by
// chronological order within each group (2 games per matchday).
function buildFixtures(){
  const out=FIXTURES.map(([group,h,a,utc])=>({
    id:h+a,group,home:byId[h],away:byId[a],utc,matchday:null,
    status:"SCHEDULED",min:null,sh:null,sa:null}));
  const byG={};out.forEach(f=>(byG[f.group]=byG[f.group]||[]).push(f));
  Object.values(byG).forEach(list=>{
    list.sort((x,y)=>new Date(x.utc)-new Date(y.utc));
    list.forEach((f,i)=>f.matchday=Math.floor(i/2)+1);});
  return out;
}
// Overlay live scores/status from the feed onto our fixtures, matched by team
// pair (order-independent); score is oriented to our home/away.
function applyLiveScores(events,fixtures){
  const map={};
  events.forEach(e=>{const h=resolve(e.strHomeTeam),a=resolve(e.strAwayTeam);if(!h||!a)return;
    map[pairKey(h.id,a.id)]={status:mapStatus(e.strStatus),min:e.strProgress||null,
      homeId:h.id,sh:num(e.intHomeScore),sa:num(e.intAwayScore)};});
  fixtures.forEach(f=>{const m=map[pairKey(f.home.id,f.away.id)];if(!m)return;
    f.status=m.status;f.min=m.min;
    if(m.sh!=null&&m.sa!=null){const swap=m.homeId!==f.home.id;
      f.sh=swap?m.sa:m.sh;f.sa=swap?m.sh:m.sa;}});
}
function mapStatus(s){s=String(s||"").toUpperCase();
  if(["FT","AET","PEN","MATCH FINISHED","FINISHED"].includes(s))return"FINISHED";
  if(["1H","2H","HT","ET","BT","P","LIVE","PLAYING","IN PLAY"].includes(s))return"LIVE";
  return"SCHEDULED";}

async function refresh(){
  const fixtures=buildFixtures();
  let events=null;
  try{const r=await fetch(SPORTSDB,{cache:"no-store"});const j=await r.json();events=j&&j.events;}catch(_){events=null;}
  if(Array.isArray(events)&&events.length){
    applyLiveScores(events,fixtures);
    const liveN=fixtures.filter(f=>f.status==="LIVE").length;
    setStatus(liveN?"live":"ok",liveN?liveN+" live now":"Live scores connected");
    setUpdated(new Date().toISOString());state.source="live";
  }else{
    setStatus("offline","Schedule loaded · live scores unavailable");setUpdated(null);state.source="offline";
  }
  state.fixtures=fixtures;render();
}
function setStatus(k,t){const p=document.getElementById("status");
  p.className="pill "+(k==="live"?"live":k==="ok"?"ok":"offline");
  document.getElementById("statusText").textContent=t;}
function setUpdated(iso){document.getElementById("updated").textContent=
  iso?"Updated "+fmtT(iso)+" "+zoneLabel:"Offline schedule";}

/* ---------------- Render --------------------------------------------------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// All kick-off times shown in UK time (Europe/London → BST in summer, GMT in winter).
const TZ="Europe/London";
const zoneLabel=(()=>{try{const p=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,timeZoneName:"short"})
  .formatToParts(new Date()).find(x=>x.type==="timeZoneName");return p&&p.value?p.value:"UK";}catch(_){return"UK";}})();
const fmtT=iso=>new Intl.DateTimeFormat("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:TZ}).format(new Date(iso));
const fmtD=iso=>new Intl.DateTimeFormat("en-GB",{weekday:"long",day:"numeric",month:"short",timeZone:TZ}).format(new Date(iso));
function chip(m,dim){return `<span class="own${dim?" dim":""}" style="background:${COLORS[m]||"#888"}">${esc(m)}</span>`;}
function teamHTML(t,side){const o=ownersByTeam[t.id]||[];
  const dimFn=m=>state.mgrFilter!=="all"&&m!==state.mgrFilter;
  return `<div class="team ${side}"><div class="tline"><span class="flag">${t.flag}</span><span>${esc(t.name)}</span></div>
    <div class="owners">${o.map(m=>chip(m,dimFn(m))).join("")}</div></div>`;}
function scoreHTML(f){
  if(f.status==="LIVE"||f.status==="FINISHED"){const h=f.sh!=null?f.sh:"-",a=f.sa!=null?f.sa:"-";
    const m=f.status==="LIVE"&&f.min?`<div class="cd">${esc(f.min)}'</div>`:"";return `<div class="score">${h}–${a}${m}</div>`;}
  return `<div class="score"><div class="kick">${fmtT(f.utc)+" "+zoneLabel}</div><div class="cd" data-cd="${f.utc}"></div></div>`;}
function vsHTML(f){const ho=ownersByTeam[f.home.id]||[],ao=ownersByTeam[f.away.id]||[];
  const both=ho.filter(m=>ao.includes(m));
  const dimFn=m=>state.mgrFilter!=="all"&&m!==state.mgrFilter;
  return `<div class="vs"><span class="side">${ho.map(m=>chip(m,dimFn(m))).join("")}</span>
    <span class="x">🆚</span><span class="side">${ao.map(m=>chip(m,dimFn(m))).join("")}</span>
    ${both.length?`<div class="both">↔ ${esc(both.join(", "))} own${both.length>1?"":"s"} a team on both sides</div>`:""}</div>`;}
function badge(f){if(f.status==="LIVE")return `<span class="badge LIVE"><span class="ldot"></span>LIVE</span>`;
  if(f.status==="FINISHED")return `<span class="badge FINISHED">Full time</span>`;return `<span class="badge SCHEDULED">Upcoming</span>`;}
function card(f){const el=document.createElement("article");el.className="match"+(f.status==="LIVE"?" live":"");
  el.innerHTML=`<div class="mtop"><span class="gtag">Group ${f.group}</span>
    <span>${f.matchday?"Matchday "+f.matchday:"Group stage"}</span>${badge(f)}</div>
    <div class="teams">${teamHTML(f.home,"home")}${scoreHTML(f)}${teamHTML(f.away,"away")}</div>${vsHTML(f)}`;return el;}

function passes(f){if(state.statusFilter!=="all"&&f.status!==state.statusFilter)return false;
  if(state.mgrFilter!=="all"){const o=new Set([...ownersByTeam[f.home.id],...ownersByTeam[f.away.id]]);
    if(!o.has(state.mgrFilter))return false;}return true;}
function dateKey(f){return fmtD(f.utc)+" · "+zoneLabel;}

function render(){
  const list=document.getElementById("list");list.innerHTML="";
  const fx=state.fixtures.filter(passes).sort((a,b)=>{
    if(a.utc&&b.utc)return new Date(a.utc)-new Date(b.utc);
    if(a.utc)return -1;if(b.utc)return 1;return (a.group+a.matchday).localeCompare(b.group+b.matchday);});
  document.getElementById("empty").hidden=fx.length>0;
  let last=null;
  fx.forEach(f=>{const k=dateKey(f);if(k!==last){const h=document.createElement("div");h.className="datehead";
    h.textContent=k;list.appendChild(h);last=k;}list.appendChild(card(f));});
  renderSummary();tick();
}
function renderSummary(){
  const box=document.getElementById("summary");
  if(state.mgrFilter==="all"){box.hidden=true;return;}
  // count meetings of selected manager vs each rival across all group matchups
  const meet={};MANAGERS.forEach(m=>meet[m]=0);
  buildFixtures().forEach(f=>{const ho=ownersByTeam[f.home.id],ao=ownersByTeam[f.away.id];
    ho.forEach(x=>ao.forEach(y=>{if(x===y)return;if(x===state.mgrFilter)meet[y]++;else if(y===state.mgrFilter)meet[x]++;}));});
  const me=state.mgrFilter,total=Object.values(meet).reduce((a,b)=>a+b,0);
  const parts=MANAGERS.filter(m=>m!==me&&meet[m]>0).sort((a,b)=>meet[b]-meet[a])
    .map(m=>`<span class="h2h">${chip(m)}×${meet[m]}</span>`).join("");
  box.innerHTML=`<b>${esc(me)}</b> faces off <b>${total}</b> times in the group stage:<br>${parts}`;
  box.hidden=false;
}
function tick(){const now=Date.now();document.querySelectorAll("[data-cd]").forEach(n=>{
  let d=Math.floor((new Date(n.getAttribute("data-cd")).getTime()-now)/1000);
  if(d<=0){n.textContent="kick-off";return;}
  const dd=Math.floor(d/86400);d%=86400;const h=Math.floor(d/3600);d%=3600;const m=Math.floor(d/60);
  n.textContent=dd>0?`in ${dd}d ${h}h`:h>0?`in ${h}h ${m}m`:`in ${m}m`;});}

/* ---------------- Filters wiring ------------------------------------------- */
function buildMgrChips(){const wrap=document.getElementById("mgrFilter");
  wrap.innerHTML=`<button class="chip mgr active" data-m="all">All managers</button>`+
    MANAGERS.map(m=>`<button class="chip mgr" data-m="${m}" style="--c:${COLORS[m]}">
      <span class="sw" style="background:${COLORS[m]}"></span>${esc(m)}</button>`).join("");
  wrap.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;
    state.mgrFilter=b.dataset.m;wrap.querySelectorAll(".chip").forEach(c=>c.classList.toggle("active",c===b));
    b.dataset.m!=="all"?b.style.color=COLORS[b.dataset.m]:0;render();});}
document.getElementById("statusFilter").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;
  state.statusFilter=b.dataset.s;
  document.querySelectorAll("#statusFilter .chip").forEach(c=>c.classList.toggle("active",c===b));render();});

// Adaptive polling: refresh every 20s while any game is live, otherwise every 60s.
let pollTimer=null;
function loopOnce(){
  if(pollTimer)clearTimeout(pollTimer);
  Promise.resolve(refresh()).finally(()=>{
    const live=state.fixtures.some(f=>f.status==="LIVE");
    pollTimer=setTimeout(loopOnce,live?20000:60000);
  });
}
// Tap the status pill to refresh on demand.
const statusPill=document.getElementById("status");
statusPill.style.cursor="pointer";statusPill.title="Tap to refresh";
statusPill.addEventListener("click",loopOnce);

buildMgrChips();
loopOnce();
setInterval(tick,1000);
</script>
</body>
</html>
